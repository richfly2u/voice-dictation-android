name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Sign APK (debug key)
        run: |
          # Use Android default debug keystore
          echo "Using debug keystore (default)"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-dictation-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Get APK info
        run: |
          ls -lh app/build/outputs/apk/release/
          
      - name: Create release APK
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/VoiceDictation.apk

      - name: Upload to release
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDictation.apk
          path: app/build/outputs/apk/release/VoiceDictation.apk
          retention-days: 30
